name: Validate plugin bundles

on:
  pull_request:
    paths:
      - 'src/CrestApps.AgentSkills/orchardcore/**'
      - 'src/CrestApps.AgentSkills/crestapps-orchardcore/**'
      - 'src/CrestApps.AgentSkills/crestapps-core/**'
      - 'plugins/orchardcore/skills/**'
      - 'plugins/crestapps-orchardcore/skills/**'
      - 'plugins/crestapps-core/skills/**'
      - '.github/workflows/publish-plugin.yml'
      - '.github/workflows/validate-plugin-bundle.yml'
      - '.github/plugin/marketplace.json'
      - '.claude-plugin/marketplace.json'

jobs:
  validate-marketplace-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate marketplace manifests
        shell: python
        run: |
          import json
          from pathlib import Path

          github_manifest_path = Path(".github/plugin/marketplace.json")
          claude_manifest_path = Path(".claude-plugin/marketplace.json")

          errors = []
          manifests = {}

          for path in (github_manifest_path, claude_manifest_path):
              try:
                  manifests[path] = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as ex:
                  errors.append(f"{path} is not a valid JSON marketplace manifest: {ex}")

          if len(manifests) == 2 and manifests[github_manifest_path] != manifests[claude_manifest_path]:
              errors.append(f"{claude_manifest_path} must have the same content as {github_manifest_path}.")

          for plugin in manifests.get(github_manifest_path, {}).get("plugins", []):
              name = plugin.get("name")
              source = Path(plugin.get("source", ""))

              if not source.is_dir():
                  errors.append(f"Plugin '{name}' source '{source}' does not exist.")
                  continue

              for skills_path in plugin.get("skills", []):
                  if not (source / skills_path).is_dir():
                      errors.append(f"Plugin '{name}' skills path '{skills_path}' does not exist under '{source}'.")

          for error in errors:
              print(f"::error::{error}")

          if errors:
              raise SystemExit(1)

          print("Marketplace manifests are valid.")


  validate-plugin-skills:
    if: github.event.pull_request.head.ref != 'automation/publish-plugin-bundle'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject plugin bundle edits in pull requests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          plugin_changes=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- \
            'plugins/orchardcore/skills/**' \
            'plugins/crestapps-orchardcore/skills/**' \
            'plugins/crestapps-core/skills/**')

          if [ -z "$plugin_changes" ]; then
            exit 0
          fi

          disallowed_changes=$(printf '%s\n' "$plugin_changes" | awk '
            $2 ~ /\/\.gitkeep$/ && $1 == "A" { next }
            $1 == "D" { next }
            { print }
          ')

          if [ -n "$disallowed_changes" ]; then
            echo "::error::Pull requests must not modify generated plugin bundles under plugins/*/skills. Update the matching source roots under src/CrestApps.AgentSkills instead; the plugin bundles are published separately."
            printf '%s\n' "$disallowed_changes"
            exit 1
          fi
